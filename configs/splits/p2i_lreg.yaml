source: >-
  P2I-LReg (Kaggle junezhou001/p2i-lreg, CC BY-NC 4.0), fixed 2026-10-26 after the format audit
  (scripts/preprocess/audit_p2i_lreg.py) and before any descriptor was run on it. Cases 01-06 are
  the six P2ILF-derived patients (dataset readme), 07-21 the authors' own. dev: format / scale /
  camera debugging only, never selection; drawn from the authors' training lists: 05 (the only 4K
  case, kept for format handling), 03 (P2ILF-derived), and 15, 19 (two own cases, numpy seed 0).
  locked: everything else, scored once at S4 (OFEAT_UNLOCK_EVAL=p2i_lreg). The authors' test cases
  (01, 02, 13, 17, 18) are all locked.
p2ilf_derived: ["01", "02", "03", "04", "05", "06"]
splits:
  dev: ["03", "05", "15", "19"]
  locked: ["01", "02", "04", "06", "07", "08", "09", "10", "11", "12", "13", "14", "16", "17", "18", "20", "21"]
